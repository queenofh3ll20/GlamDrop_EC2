# 01-control-plane.yml — Inizializzazione del Control Plane Kubernetes con kubeadm
---
- name: Inizializza il Control Plane Kubernetes
  hosts: control_plane
  become: true
  vars:
    pod_network_cidr: "192.168.0.0/16"   # Requisito per Calico CNI
    calico_manifest: "https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml"

  tasks:

    - name: Recupera l'IP privato reale del Control Plane (VPC)
      shell: hostname -I | awk '{print $1}'
      register: cp_private_ip
      changed_when: false

    - name: Verifica se il cluster esistente è allineato all'IP privato reale della VPC
      shell: |
        if [ -f /etc/kubernetes/admin.conf ] && ! grep -q "{{ cp_private_ip.stdout | trim }}" /etc/kubernetes/admin.conf; then
          echo "reset_needed"
        else
          echo "ok"
        fi
      register: cluster_endpoint_check
      changed_when: false

    - name: Resetta il control plane se l'endpoint registrato non corrisponde all'IP privato
      shell: |
        kubeadm reset -f
        rm -rf /etc/cni/net.d /etc/kubernetes/manifests /etc/kubernetes/admin.conf /var/lib/etcd /root/.kube /home/ubuntu/.kube
      when: cluster_endpoint_check.stdout == "reset_needed"

    - name: Verifica se il control plane è già stato inizializzato
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_done

    - name: Esegui kubeadm init (usa IP privato VPC per il cluster interno)
      command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ cp_private_ip.stdout | trim }}
        --control-plane-endpoint={{ cp_private_ip.stdout | trim }}
        --apiserver-cert-extra-sans={{ cp_private_ip.stdout | trim }},127.0.0.1,{{ inventory_hostname }}
        --ignore-preflight-errors=NumCPU,Mem,Swap
      when: not kubeadm_init_done.stat.exists
      register: kubeadm_init_output

    # --- kubeconfig per l'utente ubuntu ---
    - name: Crea la directory .kube per l'utente ubuntu
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copia admin.conf nella configurazione kubeconfig di ubuntu
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    # --- kubeconfig per l'utente root ---
    - name: Crea la directory .kube per root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copia admin.conf nella configurazione kubeconfig di root
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: '0600'

    # --- CNI: Calico (NetworkPolicy Enforced) ---
    - name: Installa Calico CNI con supporto completo alle NetworkPolicies
      become: false
      command: kubectl apply -f {{ calico_manifest }}
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Attendi stabilizzazione API Server e CoreDNS post-Calico
      become: false
      command: kubectl get nodes
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: api_check
      until: api_check.rc == 0
      retries: 10
      delay: 5
      changed_when: false

    # --- Comando Join Permanente & Pubblicazione su AWS SSM Parameter Store ---
    - name: Genera il comando join permanente (--ttl 0) per i nodi worker dell'ASG
      command: kubeadm token create --print-join-command --ttl 0 --description "Permanent join token for ASG workers"
      register: join_command_raw
      changed_when: false

    - name: Pubblica il comando join su AWS SSM Parameter Store
      command: >
        aws ssm put-parameter
        --name "/{{ project_name | default('glamdrop') }}/k8s/join_command"
        --type "SecureString"
        --value "{{ join_command_raw.stdout }}"
        --overwrite
        --region "{{ aws_region }}"
      become: false
      changed_when: true

    - name: Salva copia locale del comando join di backup
      copy:
        content: "{{ join_command_raw.stdout }}\n"
        dest: /tmp/k8s_join_command.sh
        mode: '0600'
      delegate_to: localhost
      become: false

    # --- Verifiche di sistema & Attesa dei Nodi Worker dell'ASG ---
    - name: Attendi che i nodi Worker dell'ASG effettuino il Self-Bootstrap e risultino Ready
      become: false
      command: kubectl get nodes --no-headers
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: nodes_check
      until: (nodes_check.stdout_lines | length >= 3) and (nodes_check.stdout_lines | select('search', 'NotReady') | list | length == 0)
      retries: 60
      delay: 15
      changed_when: false
      ignore_errors: true

    - name: Assegna la label del ruolo 'worker' a tutti i nodi non-control-plane
      become: false
      shell: |
        for node in $(kubectl get nodes --no-headers | awk '{print $1}' | grep -v control-plane); do
          kubectl label node "$node" node-role.kubernetes.io/worker=worker --overwrite || true
        done
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      changed_when: false

    - name: Stampa lo stato finale di tutti i nodi del cluster
      become: false
      command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: final_nodes_output
      changed_when: false

    - name: Report dello stato del cluster
      debug:
        msg: "{{ final_nodes_output.stdout_lines }}"
